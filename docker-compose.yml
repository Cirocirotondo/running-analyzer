# Local development stack. Same services as production (ADR 0004), all on one host.
# Start with: docker compose up -d --build

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Supabase Auth (GoTrue), self-hosted: issues the JWTs the API verifies.
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${AUTH_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB}?search_path=auth
      GOTRUE_SITE_URL: ${WEB_URL}
      GOTRUE_URI_ALLOW_LIST: ${WEB_URL}/*
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Development only: no confirmation emails.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM_ADDRESS:-noreply@running-analyzer.local}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:-}
      GOTRUE_SMTP_SENDER_NAME: Running Analyzer
      GOTRUE_LOG_LEVEL: info
    ports:
      - "9999:9999"

  # S3-compatible storage for Videos and keypoints (Hetzner Object Storage in
  # production). RustFS stands in for MinIO, whose public images were withdrawn.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Creates the bucket once the storage answers; the AWS CLI is the client here
  # so the same commands work against Hetzner in production.
  storage-init:
    image: amazon/aws-cli:2.37.9
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api head-bucket --bucket ${S3_BUCKET} 2>/dev/null && echo "bucket exists" && break;
          aws --endpoint-url http://storage:9000 s3 mb s3://${S3_BUCKET} 2>/dev/null && echo "bucket created" && break;
          sleep 2;
        done;
        aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket ${S3_BUCKET} --cors-configuration
        '{"CORSRules":[{"AllowedOrigins":["${WEB_URL}"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
        && echo "cors set"

  mailpit:
    # Development mailbox: every email (app and auth) lands here instead of being sent; web UI on :8025.
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Running Analyzer <noreply@running-analyzer.local>}
      WEB_URL: ${WEB_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./api/src:/app/src
    ports:
      - "8000:8000"

  # Pipeline worker: consumes the "analysis" queue. Two flavours, picked with
  # COMPOSE_PROFILES in .env: "cpu" mimics the production VPS (4 CPUs, ~35 min per
  # analysis), "gpu" uses the local NVIDIA card (~3 min). Run one of them.
  worker:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Running Analyzer <noreply@running-analyzer.local>}
      WEB_URL: ${WEB_URL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      ORT_THREADS: ${WORKER_CPUS:-4}
    # Mimics the small VPS the worker will run on; keep ORT_THREADS equal to this.
    cpus: ${WORKER_CPUS:-4}
    volumes:
      - ./worker/worker:/app/worker
      # The folder, not single files: a file bind mount goes stale when an editor replaces the file.
      - ./prototype:/app/prototype:ro
      - ./api/src:/app/api_src

  checker:
    # Recording Check (queue "checks"): a dozen frames per uploaded Video with the mid-size pose model,
    # answered in seconds. Separate from the analysis worker, which can be busy for many minutes.
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["uv", "run", "--no-sync", "rq", "worker", "checks", "--url", "redis://redis:6379/0"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      ORT_THREADS: "2"
    cpus: 2
    volumes:
      - ./worker/worker:/app/worker
      - ./prototype:/app/prototype:ro
      - ./api/src:/app/api_src

  janitor:
    # Hourly cleanup of Videos nobody will use: stale drafts, unanswered and expired Failure Reports
    # (worker/worker/janitor.py, docs/SPEC.md §11).
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "worker.janitor"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./worker/worker:/app/worker
      - ./prototype:/app/prototype:ro
      - ./api/src:/app/api_src

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: worker/Dockerfile.gpu
    gpus: all
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Running Analyzer <noreply@running-analyzer.local>}
      WEB_URL: ${WEB_URL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      PIPELINE_DEVICE: cuda
      PIPELINE_MAX_FPS: "240"
    volumes:
      - ./worker/worker:/app/worker
      # The folder, not single files: a file bind mount goes stale when an editor replaces the file.
      - ./prototype:/app/prototype:ro
      - ./api/src:/app/api_src

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: ${AUTH_EXTERNAL_URL}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    ports:
      - "3000:3000"

volumes:
  db-data:
  storage-data:
  web-node-modules:
  web-next:

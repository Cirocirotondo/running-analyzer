[project]
name = "running-analyzer-prototype"
version = "0.1.0"
description = "Prototype: side-view running analysis from a treadmill video"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "mediapipe",
    "rtmlib",
    "onnxruntime-gpu",
    "pandas",
    "pyarrow",
    "matplotlib>=3.11.2",
    "nvidia-cudnn-cu13>=9.27.0.42",
    "nvidia-cuda-runtime>=13.4.92",
    "nvidia-cufft>=12.4.0.43",
    "nvidia-curand>=10.4.4.72",
]

[tool.uv]
package = false
# rtmlib depends on the CPU-only onnxruntime, which shadows onnxruntime-gpu
# when both are installed. Exclude it so the GPU build is the only one.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

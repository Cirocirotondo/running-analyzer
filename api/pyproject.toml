[project]
name = "running-analyzer-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Simone", email = "simone.cirelli01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.108",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
running-analyzer-api = "running_analyzer_api:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
